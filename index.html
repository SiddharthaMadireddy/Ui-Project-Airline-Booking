<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/Ui-Project-Airline-Booking/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Indian Airlines - Seamless Flight Booking, Web Check-in & Flight Status. Demo web app.">
  <meta name="theme-color" content="#0B1F4B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Indian Airlines">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="alternate icon" type="image/png" href="favicon.png"/>

  <title>Indian Airlines | Seamless Flights, Web Check-in & Status</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0B1F4B;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 153, 51, 0.2);
      border-top-color: #FF9933;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 16px;
      font-size: 16px;
      letter-spacing: 1.5px;
      font-weight: 600;
      color: #FF9933;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="loading-text">INDIAN AIRLINES</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./indian_airlines
        run: flutter pub get

      - name: Run Code Analysis
        working-directory: ./indian_airlines
        run: flutter analyze

      - name: Run Unit & Widget Tests
        working-directory: ./indian_airlines
        run: flutter test

      - name: Build Web Application
        working-directory: ./indian_airlines
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "Building for base-href: /$REPO_NAME/"
          flutter build web --release --base-href "/$REPO_NAME/"
          touch build/web/.nojekyll

      - name: Deploy to gh-pages branch (Branch Deployment Option)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./indian_airlines/build/web

      - name: Upload Pages Artifact (GitHub Actions Deployment Option)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./indian_airlines/build/web

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
